[project]
name = "sslmate"
version = "0.1.1"
description = "Client for SSLMate's Certificate Transparency Search APIv1."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
 "fire>=0.7.0",
 "requests>=2.32.4",
 "shodan>=1.31.0",
]

[dependency-groups]
dev = ["pre-commit>=4.2.0", "pynvim>=0.5.2"]

[tool.markdownlint]
MD013 = { "code_blocks" = false, "heading_line_length" = 100, tables = false }
